services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leave_audit
      POSTGRES_USER: leave_audit
      POSTGRES_PASSWORD: leave_audit_dev
    ports: ["5432:5432"]
    volumes: ["leave-audit-pg:/var/lib/postgresql/data"]
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: leave_audit
      RABBITMQ_DEFAULT_PASS: leave_audit_dev
      RABBITMQ_DEFAULT_VHOST: /leave-audit
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: leave_audit
      MINIO_ROOT_PASSWORD: leave_audit_dev
    volumes: ["leave-audit-minio:/data"]
volumes:
  leave-audit-pg:
  leave-audit-minio:
