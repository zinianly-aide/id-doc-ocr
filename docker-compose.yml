services:
  api:
    build:
      context: .
      args:
        ID_DOC_OCR_PYTHON_BASE_IMAGE: ${ID_DOC_OCR_PYTHON_BASE_IMAGE:-python:3.11-slim-bookworm}
        ID_DOC_OCR_INSTALL_PADDLE: ${ID_DOC_OCR_INSTALL_PADDLE:-1}
        ID_DOC_OCR_APT_MIRROR: ${ID_DOC_OCR_APT_MIRROR:-http://deb.debian.org/debian}
        ID_DOC_OCR_APT_SECURITY_MIRROR: ${ID_DOC_OCR_APT_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        ID_DOC_OCR_PIP_INDEX_URL: ${ID_DOC_OCR_PIP_INDEX_URL:-https://pypi.org/simple}
        ID_DOC_OCR_PIP_EXTRA_INDEX_URL: ${ID_DOC_OCR_PIP_EXTRA_INDEX_URL:-}
        ID_DOC_OCR_PIP_TRUSTED_HOST: ${ID_DOC_OCR_PIP_TRUSTED_HOST:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    restart: unless-stopped
    ports:
      - "${ID_DOC_OCR_PORT:-8000}:8000"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      ID_DOC_OCR_LOG_LEVEL: ${ID_DOC_OCR_LOG_LEVEL:-info}
      ID_DOC_OCR_FAILURE_DIR: /data/failures
      ID_DOC_OCR_DEFAULT_OCR_BACKEND: ${ID_DOC_OCR_DEFAULT_OCR_BACKEND:-paddleocr}
      ID_DOC_OCR_DEFAULT_VLM_BACKEND: ${ID_DOC_OCR_DEFAULT_VLM_BACKEND:-mock}
      ID_DOC_OCR_DEFAULT_DETECTOR_BACKEND: ${ID_DOC_OCR_DEFAULT_DETECTOR_BACKEND:-pil}
      ID_DOC_OCR_DEFAULT_RECTIFY_BACKEND: ${ID_DOC_OCR_DEFAULT_RECTIFY_BACKEND:-pil}
    volumes:
      - ${ID_DOC_OCR_FAILURE_DIR:-./data/failures}:/data/failures
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command:
      [
        "id-doc-ocr-api",
        "--host",
        "${ID_DOC_OCR_HOST:-0.0.0.0}",
        "--port",
        "${ID_DOC_OCR_API_PORT:-8000}",
      ]

  ui:
    build:
      context: .
      args:
        ID_DOC_OCR_PYTHON_BASE_IMAGE: ${ID_DOC_OCR_PYTHON_BASE_IMAGE:-python:3.11-slim-bookworm}
        ID_DOC_OCR_INSTALL_PADDLE: ${ID_DOC_OCR_INSTALL_PADDLE:-1}
        ID_DOC_OCR_APT_MIRROR: ${ID_DOC_OCR_APT_MIRROR:-http://deb.debian.org/debian}
        ID_DOC_OCR_APT_SECURITY_MIRROR: ${ID_DOC_OCR_APT_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        ID_DOC_OCR_PIP_INDEX_URL: ${ID_DOC_OCR_PIP_INDEX_URL:-https://pypi.org/simple}
        ID_DOC_OCR_PIP_EXTRA_INDEX_URL: ${ID_DOC_OCR_PIP_EXTRA_INDEX_URL:-}
        ID_DOC_OCR_PIP_TRUSTED_HOST: ${ID_DOC_OCR_PIP_TRUSTED_HOST:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ID_DOC_OCR_UI_PORT:-8080}:8080"
    volumes:
      - ./ui:/ui:ro
    command: ["python", "-m", "http.server", "8080", "-d", "/ui"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/index.html', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
