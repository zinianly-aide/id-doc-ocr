[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "id-doc-ocr"
version = "0.1.0"
description = "Self-hosted OCR pipeline for identity documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "zinianly-aide"}]
dependencies = [
  "pydantic>=2.0,<3.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "pypdfium2>=4.30.0,<5.0.0",
  "pillow>=10.0,<12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27.0,<1.0.0",
]
ocr = [
  "rapidocr_onnxruntime>=1.4.4,<2.0.0",
]
paddle-vl = [
  "paddleocr>=3.0.0,<4.0.0",
]
paddle = [
  "paddleocr>=2.7.3,<4.0.0",
]
oracle = [
  "oracledb>=2.0,<4.0",
]
postgres = [
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
]
rabbitmq = [
  "pika>=1.3,<2.0",
]
object-storage = [
  "boto3>=1.34,<2.0",
]

[project.scripts]
id-doc-ocr = "id_doc_ocr.cli.main:main"
id-doc-ocr-api = "id_doc_ocr.cli.main:main_api"
id-doc-ocr-worker = "id_doc_ocr.cli.worker:main"
id-doc-ocr-callback-worker = "id_doc_ocr.cli.callback_worker:main"

[tool.setuptools.packages.find]
where = ["src"]
